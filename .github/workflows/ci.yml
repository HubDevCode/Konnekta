name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude konnekta-desktop --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libdbus-1-dev libxcb1-dev libxkbcommon-dev pkg-config
      # Core, crypto/TLS, pairing, permissions, plugins and FFI on every OS.
      # Failures are echoed as annotations so they show without the raw log.
      - name: Test
        shell: bash
        run: |
          set +e
          cargo test --workspace --exclude konnekta-desktop --no-fail-fast 2>&1 | tee test.log
          if [ "${PIPESTATUS[0]}" != 0 ]; then
            grep -E "^test .* FAILED|panicked at|^error|could not compile|undefined reference|cannot find -l|ld: " -A2 test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Dedicated security suite: TLS pinning, MITM, permissions, payload auth.
      - name: Security tests
        run: |
          cargo test -p konnekta-crypto
          cargo test -p konnekta-core --test integration
          cargo test -p konnekta-core payload
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo build -p konnekta-desktop

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - run: cargo install cargo-ndk --locked
      # Core with cargo-ndk, then the APK and the app's unit tests.
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GRADLE: gradle
        run: bash scripts/build-android.sh debug
