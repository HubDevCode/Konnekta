name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Konnekta ${{ steps.tag.outputs.version }}
          generate_release_notes: true

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin --bundles app"
          - os: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @tauri-apps/cli@2
      # Produces AppImage/deb/rpm (Linux), MSI/NSIS (Windows), .app (macOS: the
      # DMG step fails on GitHub's runners, so only the .app archive is built).
      # Code signing is enabled automatically when the secrets are set.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: tauri
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
      # Plain executable + checksum: what the in-app updater downloads on Linux.
      - name: Updater asset (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/konnekta-desktop konnekta-desktop-linux-x86_64
          sha256sum konnekta-desktop-linux-x86_64 > konnekta-desktop-linux-x86_64.sha256
          gh release upload "${{ needs.create-release.outputs.tag }}" konnekta-desktop-linux-x86_64 konnekta-desktop-linux-x86_64.sha256 --clobber

  cli:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: konnekta
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: konnekta.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: konnekta
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: konnekta
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libdbus-1-dev libxcb1-dev libxkbcommon-dev pkg-config
      - run: cargo build --release -p konnekta-cli --target ${{ matrix.target }}
      # PAM helper for fingerprint approval (Linux and macOS).
      - if: runner.os != 'Windows'
        run: cargo build --release -p konnekta-approve --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=konnekta-cli-${{ needs.create-release.outputs.tag }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} "$name/"
          cp README.md LICENSE packaging/konnekta.service "$name/" 2>/dev/null || true
          if [ "${{ runner.os }}" != "Windows" ]; then
            cp target/${{ matrix.target }}/release/konnekta-approve packaging/install-approve.sh "$name/"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release upload "${{ needs.create-release.outputs.tag }}" konnekta-cli-*.zip konnekta-cli-*.tar.gz --clobber -R "$GITHUB_REPOSITORY"

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - run: cargo install cargo-ndk --locked
      # Signed with the release key when the secrets exist (see docs/RILASCIO.md).
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KONNEKTA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GRADLE: gradle
          KONNEKTA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KONNEKTA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KONNEKTA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-android.sh release
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # app-arm64-v8a-release.apk, app-x86_64-release.apk, app-universal-release.apk
          for f in apps/android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" -release.apk); abi=${abi#app-}
            cp "$f" "konnekta-${{ needs.create-release.outputs.tag }}-android-$abi.apk"
          done
          gh release upload "${{ needs.create-release.outputs.tag }}" konnekta-*-android-*.apk --clobber -R "$GITHUB_REPOSITORY"

  ios:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Flutter project
        working-directory: apps/mobile
        run: ./scripts/prepare.sh
      - name: Build Rust core
        run: apps/mobile/scripts/build_rust.sh ios
      # Unsigned build; App Store / TestFlight signing needs an Apple
      # developer account (see docs/RILASCIO.md).
      - name: Build
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr "konnekta-${{ needs.create-release.outputs.tag }}-unsigned.ipa" Payload
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/mobile
        run: gh release upload "${{ needs.create-release.outputs.tag }}" konnekta-*-unsigned.ipa --clobber -R "$GITHUB_REPOSITORY"

  # The release stays a draft while the builds upload; it is published once the
  # desktop, CLI and Android files are all there (iOS may still be running).
  publish:
    needs: [create-release, desktop, cli, android, ios]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.cli.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false --latest -R "$GITHUB_REPOSITORY"
