[package]
name = "konnekta-crypto"
description = "Identity certificates, pinned mutual TLS and key storage for Konnekta"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Store the private key in the OS credential store (Keychain, Credential
# Manager, Secret Service) instead of a 0600 file.
os-keyring = ["dep:keyring"]

[dependencies]
rustls.workspace = true
rustls-pki-types.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
time = "0.3"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }
tokio-rustls = { workspace = true }
