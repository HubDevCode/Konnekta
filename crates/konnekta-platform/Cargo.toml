[package]
name = "konnekta-platform"
description = "OS integrations for Konnekta (clipboard, input, media, notifications, DND, launching)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop"]
# Native desktop backends. Disabled when building the core for Android / iOS,
# where the mobile app provides these through FFI callbacks.
desktop = ["dep:enigo", "dep:arboard", "dep:notify-rust", "dep:open", "dep:image"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
enigo = { version = "0.6", optional = true }
arboard = { version = "3", optional = true, default-features = false, features = ["image-data"] }
notify-rust = { version = "4", optional = true }
open = { version = "5", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", optional = true, default-features = false, features = ["image-data", "wayland-data-control"] }
enigo = { version = "0.6", optional = true, features = ["x11rb", "wayland"] }
