[package]
name = "konnekta-cli"
description = "Konnekta daemon and command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "konnekta"
path = "src/main.rs"

[dependencies]
konnekta-core.workspace = true
konnekta-crypto.workspace = true
konnekta-plugins.workspace = true
konnekta-media.workspace = true
konnekta-platform = { workspace = true, features = ["desktop"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive", "env"] }

[target.'cfg(unix)'.dependencies]
konnekta-approve.workspace = true
libc = "0.2"
